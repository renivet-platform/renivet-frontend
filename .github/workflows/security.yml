name: Frontend production dependency audit
on:
  pull_request:
  push:
    branches: [main, phase0/foundation]
  schedule:
    - cron: '31 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Reject high/critical runtime dependency advisories
        run: npm audit --omit=dev --audit-level=high
      - name: Reject high/critical advisories in the full dependency tree (including PostCSS tooling)
        run: npm audit --audit-level=high
