# Temporary review-branch-only job. Remove after committing the regenerated lockfile.
# No repository writes, credentials, or external artifact uploads.
name: Frontend lockfile regeneration (temporary)
on:
  pull_request:
    paths:
      - package.json
      - .github/workflows/temporary-lockfile-regeneration.yml
permissions:
  contents: read
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resolve a fresh npm lockfile without running scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Emit regenerated lockfile for controlled GitHub connector commit
        run: |
          echo RENIVET_LOCK_BEGIN
          sed 's/^/RENIVET_LOCK_LINE:/' package-lock.json
          echo RENIVET_LOCK_END
