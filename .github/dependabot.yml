# Dependabot policy: monitor all dependency versions, including major upgrades.
# Proposals are not merge approvals. CI and human review remain required.
# Version-update cooldown does not delay Dependabot security updates.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 3
      semver-major-days: 14
    groups:
      # Keep low-risk version updates together; major upgrades are separate PRs.
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
